    <title>FoodMapper · IBS Nutrition Guide</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages routing restoration
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = decodeURIComponent(a[1] || '');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (l.hash || '')
            );
          }
        }
      }(window.location));
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
