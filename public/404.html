<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#aa3bff" />
    <meta name="background-color" content="#ffffff" />
    <meta name="description" content="Guida nutrizionale per la gestione della sindrome dell'intestino irritabile (IBS)." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>FoodMapper · IBS Nutrition Guide</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var isLocal = l.hostname === 'localhost' || l.hostname === '127.0.0.1' || l.hostname === '';
      var knownRoutes = ['calc', 'diary', 'diet', 'recipes', 'shopping', 'workout', 'sleep', 'foods', 'hub', 'changelog', 'developer'];
      var repo = l.pathname.split('/')[1];
      var base = (isLocal || !repo || knownRoutes.indexOf(repo) !== -1) ? '' : '/' + repo;

      var redirectPath = l.pathname.slice(base.length);
      if (!redirectPath.startsWith('/')) {
        redirectPath = '/' + redirectPath;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + '/?p=' + encodeURIComponent(redirectPath + l.search + l.hash)
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
