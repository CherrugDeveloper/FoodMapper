name: CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '*.md'
      - '*.json'
      - '*.ts'
      - '*.config.*'
      - '.github/workflows/*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      shard:
        description: 'Optional shard index (e.g. 1/3). Leave empty to run all shards.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'
  NODE_OPTIONS: '--no-deprecation'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc -b --force

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run --reporter=junit --outputFile=test-results/unit-results.xml

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: unit-test-results
          path: test-results/unit-results.xml
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Generate bundle analysis report
        run: npx vite-bundle-analyzer --mode static --filename stats.html

      - name: Audit translation keys
        run: node check_keys.cjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist
          retention-days: 30

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: bundle-report
          path: dist/stats.html
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      DEBIAN_FRONTEND: 'noninteractive'
      PLAYWRIGHT_WEBKIT: '1'
      PLAYWRIGHT_SKIP_BUILD: '1'
      PLAYWRIGHT_BROWSERS_PATH: '/ms-playwright'
      HOME: '/tmp'
      DOCKER_CONFIG: '/tmp/.docker'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Approve install scripts
        run: npm install-scripts approve esbuild@0.28.2

      - name: Fix npm audit vulnerabilities
        run: npm audit fix --audit-level=moderate || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4.6.0
        with:
          name: github-pages
          path: dist

      - name: Run Playwright tests
        env:
          CI: true
        run: |
          echo "DEBUG: inputs.shard='${{ inputs.shard }}'"
          echo "DEBUG: matrix.shard='${{ matrix.shard }}'"
          SHARD_INPUT="${{ inputs.shard }}"
          if [ -n "$SHARD_INPUT" ] && echo "$SHARD_INPUT" | grep -qE '^[0-9]+/[0-9]+$'; then
            echo "Running with validated input shard: $SHARD_INPUT"
            npx playwright test --retries=0 --shard="$SHARD_INPUT"
          else
            echo "Running with matrix shard: ${{ matrix.shard }}"
            npx playwright test --retries=0 --shard="${{ matrix.shard }}"
          fi

      - name: Upload Playwright test results (${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload Playwright traces (${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: test-results/**/trace.zip
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    permissions:
      id-token: write
      pages: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4.4.0
        with:
          name: github-pages
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.2.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4