name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '24'
  PLAYWRIGHT_BROWSERS_PATH: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `tsc --noEmit` on the root `tsconfig.json` compiles ZERO files: it is a
      # solution file (`files: []` + project references), so the previous step
      # passed unconditionally. `tsc -b` actually builds app, node and the new
      # e2e project (`tests/e2e` + `playwright.config.ts`).
      - name: Run TypeScript type check
        run: npx tsc -b --force

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run --reporter=junit --outputFile=test-results/unit-results.xml

      - name: Upload unit test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: test-results/unit-results.xml
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Generate bundle analysis report
        run: npx vite-bundle-analyzer --mode static --filename stats.html

      - name: Audit translation keys
        run: node check_keys.cjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-report
          path: dist/stats.html
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # No background dev server: `playwright.config.ts` owns the lifecycle of
      # the server it serves the suite from. The manual `vite --port 5175` that
      # used to run here was unreachable (the suite's `baseURL` is
      # http://localhost:4173) and the webServer step still rebuilt `dist` from
      # scratch, burning the whole startup budget before the first test ran.
      - name: Run Playwright tests
        run: npx playwright test --reporter=line,junit,html
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          # `dist` was restored from the build job above: only *serve* it.
          PLAYWRIGHT_SKIP_BUILD: '1'
          CI: true

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/**/trace.zip
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit, build, e2e]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5